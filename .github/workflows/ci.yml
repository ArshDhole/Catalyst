name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check src/server.js
      - run: node --check src/core/providers.js
      - run: node --check src/core/orchestrator.js
      - run: node --check src/api/routes.js
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalyst-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: catalyst-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
